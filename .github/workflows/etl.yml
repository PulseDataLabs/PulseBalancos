name: PulseBalanços - Ingestão e Processamento CVM

on:
  schedule:
    # Horários em UTC (BRT = UTC-3)
    # 07h00 BRT (Manhã) - Captura de publicações da madrugada/início do dia
    - cron: '0 10 * * 1-5'
    # 20h00 BRT (Noite) - Captura após o fechamento do pregão da B3
    - cron: '0 23 * * 1-5'

  # Execução manual parametrizada via GitHub Console
  workflow_dispatch:
    inputs:
      year:
        description: 'Ano de referência para processamento'
        required: true
        default: '2024'
        type: string
      doc_type:
        description: 'Tipo de documento CVM a processar'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - DFP
          - ITR
      force_reload:
        description: 'Ignorar cache ETag/Last-Modified (forçar download)'
        required: false
        default: false
        type: boolean

concurrency:
  group: pulsebalancos-etl
  cancel-in-progress: false

jobs:
  etl:
    name: Pipeline Serverless CVM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Local (America/Sao_Paulo)
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restaurar Cache de Metadados HTTP
        uses: actions/cache@v4
        with:
          path: data/metadata
          key: pulsebalancos-metadata-cache-${{ hashFiles('data/metadata/http_cache_metadata.json') }}
          restore-keys: |
            pulsebalancos-metadata-cache-

      - name: Executar Pipeline de Extração e Carga
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          INPUT_YEAR: ${{ github.event.inputs.year || '2024' }}
          INPUT_DOC_TYPE: ${{ github.event.inputs.doc_type || 'ALL' }}
          FORCE_RELOAD: ${{ github.event.inputs.force_reload || 'false' }}
        run: |
          python run_all.py \
            --year "${INPUT_YEAR}" \
            --doc-type "${INPUT_DOC_TYPE}" \
            $( [ "$FORCE_RELOAD" = "true" ] && echo "--force" )

      - name: Publicar Sumário da Execução no GitHub Summary
        if: always()
        run: |
          if [ -f data/etl_summary.md ]; then
            cat data/etl_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Execução concluída sem relatório sumário gerado." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Persistir Metadados e Catálogos Atualizados
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies_catalog.json data/companies_catalog.parquet data/companies/ data/metadata/http_cache_metadata.json
          git commit -m "chore(data): atualização automática diária de companhias e demonstrativos CVM [skip ci]" || echo "Nenhuma alteração de dados para commit."
          git push || echo "Nenhuma alteração para enviar."

